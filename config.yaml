vertex_ai:
  training:
    container_uri: "us-docker.pkg.dev/vertex-ai/trained/scikit-learn-gpu.1-0:latest"
    machine_type: "n1-standard-8"
    replica_count: 1
  prediction:
    machine_type: "n1-standard-4"
    min_replica_count: 1
    max_replica_count: 3

prs:
  method: "elastic_net"
  alpha_range: [0.0, 0.25, 0.5, 0.75, 1.0]
  l1_ratio_range: [0.0, 0.25, 0.5, 0.75, 1.0]
  n_pcs: 10
  cv_folds: 5
  p_value_thresholds:
    - 1e-6
    - 1e-4
    - 0.001
    - 0.01
    - 0.05
